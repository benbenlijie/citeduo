name: Secret scan
on:
  push: { branches: [main, 'refactor/**'] }
  pull_request: { branches: [main] }
  # 每周一 03:17 UTC 重新扫一遍：新规则上线后，旧提交可能才被判定为泄露。
  schedule: [{ cron: '17 3 * * 1' }]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 必须取全量历史：只扫 HEAD 会漏掉历史上提交过、后来删掉的密钥。
          fetch-depth: 0
      - run: bash scripts/secret-scan.sh
