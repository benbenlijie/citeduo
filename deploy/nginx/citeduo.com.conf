server {
    listen 80;
    listen [::]:80;
    server_name citeduo.com www.citeduo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://citeduo.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.citeduo.com;

    include /etc/nginx/snippets/watchdeep-security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/citeduo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citeduo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://citeduo.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name citeduo.com;

    include /etc/nginx/snippets/watchdeep-security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/citeduo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citeduo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location = /health-nginx {
        access_log off;
        default_type text/plain;
        return 200 "citeduo nginx healthy\n";
    }

    # Redirect bare /papers -> /papers/ while preserving deep-link query params
    location = /papers {
        return 301 https://citeduo.com/papers/$is_args$args;
    }

    # Interactive workspace (/papers/, /papers/api/*, /papers/read/*, /papers/stats)
    include /etc/nginx/snippets/connectedpapers.conf;

    # First-party conversion beacons emitted from /, /zh/, /guides/*, /compare/*, /docs/*
    location /api/analytics/ {
        proxy_pass http://127.0.0.1:8787/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Server-rendered bilingual landing, guides, comparisons, docs, robots.txt, sitemaps, and 404s
    location / {
        rewrite ^/(.*)$ /site/$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
